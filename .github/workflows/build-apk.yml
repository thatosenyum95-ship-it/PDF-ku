name: Build PDF-ku APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify APK integrity and launcher
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          echo "APK size: $(stat -c%s "$APK") bytes"
          echo "SHA-256: $(sha256sum "$APK" | cut -d' ' -f1)"
          AAPT2="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt2 | sort -V | tail -n 1)"
          test -x "$AAPT2"
          "$AAPT2" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.larastudio.pdfku'" /tmp/badging.txt
          grep -q "application-icon" /tmp/badging.txt
          unzip -l "$APK" | grep -q "mipmap-anydpi-v26/ic_launcher.xml"
          unzip -l "$APK" | grep -q "mipmap-anydpi-v26/ic_launcher_round.xml"
          unzip -l "$APK" | grep -q "mipmap-anydpi-v26/ic_launcher.xml"
          unzip -l "$APK" | grep -q "mipmap-anydpi-v26/ic_launcher_round.xml"
          if unzip -l "$APK" | grep -q "mipmap.*/ic_launcher.png"; then
            echo "Unexpected legacy PNG launcher resource found"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PDF-ku-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
